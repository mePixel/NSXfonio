services:
  postgres:
    image: postgres:16-alpine
    container_name: nsxfonio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nsxfonio
      POSTGRES_PASSWORD: nsxfonio
      POSTGRES_DB: nsxfonio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsxfonio -d nsxfonio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
